    </div>

            <div class="lying-book book-3">
                <span></span>
                <b>MUSIC</b>
            </div>

        </div>

                <div class="book brown"

                <div class="book brown"
                     style="--width:41px;--height:77%;"></div>

                <div class="book green"
                     style="--width:52px;--height:91%;"></div>

                <div class="book yellow"

                <div class="book purple"
                     style="--width:57px;--height:97%;"></div>

                <div class="book dark"

                <div class="book red"

                <div class="book yellow"

                <div class="book purple"
